<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Origins ID – Games</title>
<meta name="description" content="Origins ID makes small, relaxing mobile games.">
<style>
  :root { --bg:#f3f8fa; --ink:#0c2a3b; --muted:#4b6877; --accent:#0b7c86; --line:#cfe0e7; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#08202c; --ink:#e6f2f6; --muted:#9db8c4; --accent:#4fd0d6; --line:#1f4558; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:1.0625rem/1.65 Georgia,"Times New Roman",serif; }
  .wrap { max-width:40rem; margin:0 auto; padding:3rem 1.25rem 4rem; }
  h1 { font:700 2.2rem/1.2 "Trebuchet MS","Segoe UI",sans-serif; margin:0 0 .3rem; }
  h2 { font:700 1.2rem/1.3 "Trebuchet MS","Segoe UI",sans-serif; margin:2.2rem 0 .5rem; }
  .tag { color:var(--muted); margin:0 0 2rem; }
  .card { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:.5rem; padding:1rem 1.2rem; }
  .card p { margin:.3rem 0; }
  a { color:var(--accent); text-underline-offset:3px; }
  a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Origins ID</h1>
  <p class="tag">Small, relaxing mobile games.</p>

  <h2>Games</h2>
  <div class="card">
    <p><strong>AquaTide: Block Puzzle</strong></p>
    <p>A calm underwater block puzzle for Android.</p>
    <p><a href="aquatide/privacy/">Privacy Policy</a></p>
  </div>

  <h2>Contact</h2>
  <p><a href="mailto:playbyorigins@gmail.com">playbyorigins@gmail.com</a></p>
</div>
</body>
</html>
